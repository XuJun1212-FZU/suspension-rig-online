<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 悬架试验台架</title><style>/* LOGIN_CSS */</style></head>
<body class="login-page"><main class="login-shell"><section class="login-intro"><div class="login-eyebrow">SUSPENSION ENGINEERING / CLOUD WORKSPACE</div><div class="login-mark" aria-hidden="true">Ⅲ <span>/</span> Ⅴ</div><h1>悬架试验台架<br><span>联合设计工作台</span></h1><p>从同一份最新参数出发。<br>每一次设计调整，都有据可查。</p><div class="login-features"><span>三缸 / 五缸联合优化</span><span>云端共享参数</span><span>完整更新记录</span></div><div class="login-foot">参数计算 · 运动可视化 · 版本记录</div></section>
<section class="login-card"><div class="login-eyebrow">MEMBER ACCESS</div><h2 id="loginTitle">登录工作台</h2><p id="loginHint">请输入站点账号和密码，验证后进入。</p><form id="loginForm"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" placeholder="请输入账号"><label for="password">密码</label><input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128" placeholder="请输入密码"><div id="setupFields" hidden><label for="confirmPassword">确认密码</label><input type="password" id="confirmPassword" autocomplete="new-password" maxlength="128" placeholder="再次输入密码"><label for="setupToken">初始化密钥</label><input type="password" id="setupToken" autocomplete="off" maxlength="256" placeholder="由站点部署者提供"></div><p id="loginError" class="cloud-error" role="alert"></p><button id="loginSubmit" class="cloud-primary" type="submit" disabled>正在连接…</button></form><p class="login-note">登录后读取全体成员共用的最新参数。<br>保存时需登记更新人和更新内容。</p></section></main><script>/* LOGIN_JS */</script></body></html>
