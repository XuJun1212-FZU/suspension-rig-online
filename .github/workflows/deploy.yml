name: Deploy suspension rig
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suspension-rig-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify
        run: |
          node scripts/build.mjs
          node scripts/validate-artifact.mjs
          node --test tests/*.test.mjs
      - name: Configure provisioned database
        run: node scripts/configure-cloudflare.mjs
      - name: Apply schema migrations
        run: npx --yes wrangler@4 d1 migrations apply suspension-rig-db --remote
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
      - name: Set initial administrator setup key
        env:
          RIG_SETUP_TOKEN: ${{ secrets.RIG_SETUP_TOKEN }}
        run: |
          if [ -n "$RIG_SETUP_TOKEN" ]; then
            printf '%s' "$RIG_SETUP_TOKEN" | npx --yes wrangler@4 secret put SETUP_TOKEN
          fi
